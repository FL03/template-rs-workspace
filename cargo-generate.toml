[template]
cargo_generate_version = ">=0.23.8"
ignore = [
  ".agents", ".artifacts", ".claude", ".codex", ".devcontainer", ".github",
  ".shepherd", ".vscode", ".env.example", ".envrc", ".DS_Store",
  "AGENTS.md", "CLAUDE.md", "CHANGELOG.md", "CODEOWNERS", "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md", "SECURITY.md", "Cargo.lock", "clippy.toml", "default.nix",
  "flake.nix", "flake.lock", "shell.nix", "scripts", "hooks", "target",
]

[hooks]
pre = ["hooks/validate.rhai"]

[placeholders.alias]
default = "FL03"
prompt = "GitHub owner for the generated repository"
regex = '^[A-Za-z0-9][A-Za-z0-9-]*$'
type = "string"

[placeholders.description]
default = "A composable Rust workspace"
prompt = "A short, single-line description (no quotes or backslashes)"
regex = '^[^"\\\x00-\x1F\x7F]*$'
type = "string"
