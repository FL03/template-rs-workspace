name: cargo-build

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  push:
    tags:
      - latest
      - v[0-9]*
      - v[0-9]*.[0-9]*.[0-9]*
  repository_dispatch:
    types: [cargo-build]
  workflow_dispatch:
    inputs:
      runner:
        default: self-hosted
        description: What type of runner should the action leverage?
        type: choice
        options: [macos-latest, ubuntu-latest, windows-latest, self-hosted]
      target:
        default: x86_64-unknown-linux-gnu
        description: "Select the target to compile for"
        required: false
      toolchain:
        default: stable
        description: "Select a toolchain to test (stable, nightly)"
        required: true
        type: choice
        options: [stable, nightly]

permissions:
  contents: read

jobs:
  generated-projects:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.client_payload.ref || github.ref }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ inputs.toolchain || 'stable' }}
          components: rustfmt, clippy
          cache: false
          target: ${{ inputs.target || 'x86_64-unknown-linux-gnu' }}
      - name: Install cargo-generate
        run: cargo install cargo-generate --version 0.23.8 --locked
      - name: Check CI policy
        run: python scripts/test-ci-policy.py
      - name: Validate generated projects
        env:
          RUSTUP_TOOLCHAIN: ${{ inputs.toolchain || 'stable' }}
          CARGO_BUILD_TARGET: ${{ inputs.target || 'x86_64-unknown-linux-gnu' }}
        run: python scripts/test-generation.py --mode build --output "$RUNNER_TEMP/template-check"
