name: template-check

on:
  pull_request:
    branches: [main, master, 'v[0-9]*.[0-9]*.[0-9]*']
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generated-projects:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: false
      - name: Install cargo-generate
        run: cargo install cargo-generate --version 0.23.8 --locked
      - name: Check CI policy
        run: python scripts/test-ci-policy.py
      - name: Validate generated projects
        env:
          RUSTUP_TOOLCHAIN: stable
        run: python scripts/test-generation.py --mode all --output "$RUNNER_TEMP/template-check"
